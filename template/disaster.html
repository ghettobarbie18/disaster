<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disaster Template</title>

<style>
.disaster-template {
    width: 700px;
    height: 600px;
    margin: auto;
    position: relative;
    overflow: hidden;
}

.decorative-box {
    z-index: 2;
    box-sizing: border-box;
    border: 2px solid #680018;
    pointer-events: none;
    animation: border-glow 3s ease-in-out infinite alternate;
}

@keyframes border-glow {
    from {
        box-shadow: 0 0 4px #680018;
    }
    to {
        box-shadow:
            0 0 10px #c90035,
            0 0 25px #680018;
    }
}

.background-image {
    width: 100%;
    height: 100%;
    background: url('https://raw.githubusercontent.com/ghettobarbie18/disaster/refs/heads/main/disaster.webp') center / cover no-repeat;
}
</style>
</head>

<body>

<div class="disaster-template">

    <div class="background-image"></div>
    <div class="decorative-box"></div>
</div>

</body>
</html>
