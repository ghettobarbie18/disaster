<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disaster Template</title>

<style>
.disaster-template {
    width: 700px;
    height: 600px;
    margin: auto;
    position: relative;
}

.background-image {
    width: 100%;
    height: 100%;
    background: url('https://raw.githubusercontent.com/ghettobarbie18/disaster/refs/heads/main/disaster.webp') center / cover no-repeat;
}

.decorative-box {
    position: absolute;
    inset: 18px;
    z-index: 2;
    pointer-events: none;

    border: 5px solid #4A4A4A;
    outline: 2px solid #E2B4BD;
    outline-offset: -7px;

    box-shadow:
        0 0 8px #680018,
        inset 0 0 12px rgba(104, 0, 24, 0.6);

    animation: border-glow 3s ease-in-out infinite alternate;
}

/* Inner ornamental line */
.decorative-box::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid rgba(220, 95, 120, 0.75);
}

/* Decorative corner details */
.decorative-box::after {
    content: "";
    position: absolute;
    inset: 3px;

    background:
        linear-gradient(#c43c59, #c43c59) left top / 35px 2px no-repeat,
        linear-gradient(#c43c59, #c43c59) left top / 2px 35px no-repeat,

        linear-gradient(#c43c59, #c43c59) right top / 35px 2px no-repeat,
        linear-gradient(#c43c59, #c43c59) right top / 2px 35px no-repeat,

        linear-gradient(#c43c59, #c43c59) left bottom / 35px 2px no-repeat,
        linear-gradient(#c43c59, #c43c59) left bottom / 2px 35px no-repeat,

        linear-gradient(#c43c59, #c43c59) right bottom / 35px 2px no-repeat,
        linear-gradient(#c43c59, #c43c59) right bottom / 2px 35px no-repeat;
}

@keyframes border-glow {
    from {
        filter: drop-shadow(0 0 2px #680018);
    }

    to {
        filter: drop-shadow(0 0 7px #c90035);
    }
}
</style>
</head>

<body>

<div class="disaster-template">

    <div class="background-image"></div>
    <div class="decorative-box"></div>
</div>

</body>
</html>
